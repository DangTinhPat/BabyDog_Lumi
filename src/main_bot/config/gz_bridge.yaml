# ros_gz_bridge topic list for sim.launch.py's parameter_bridge node.
# No /imu entry (yet) - no IMU sensor in babydog.xacro in this phase, see the
# note there for how to add both back together.
- ros_topic_name: "clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
